. github/workflows/build-apk.yml
name: Build LearnSmart Ghana APK

on:
workflow_dispatch:
push:
paths:
- 'LearnSmartGhana_Android_Project_v2.zip'
- '.github/workflows/build-apk.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Check out repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Unpack Android project
    run: unzip -o LearnSmartGhana_Android_Project_v2.zip

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v6
    with:
      gradle-version: '8.9'

  - name: Build debug APK
    working-directory: LearnSmartGhana
    run: gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: LearnSmartGhana-debug-apk
      path: LearnSmartGhana/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 7
